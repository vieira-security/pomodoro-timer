version: 2
updates:
  # Atualiza as actions (mantendo o pin por SHA com o comentário da versão)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dependências de desenvolvimento (Playwright, Lighthouse CI, http-server)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
