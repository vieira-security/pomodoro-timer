name: Production monitor

# Testa o site PUBLICADO: todo dia e logo depois de cada deploy.
# Se quebrar, abre uma issue (ou comenta na que já existe); se voltar ao normal, fecha a issue.
on:
  schedule:
    - cron: "41 10 * * *" # todo dia, 07:41 em Brasília
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    # depois do CI, só roda se o deploy aconteceu (CI verde)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      PROD_MONITOR: "1"
      PROD_URL: https://vieira-security.github.io/pomodoro-timer/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: smoke
        run: npx playwright test --project=production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: production-monitor-report
          path: playwright-report/
          retention-days: 30

      - name: Open or update incident issue
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create production-incident --color B60205 --description "Production monitor failure" 2>/dev/null || true
          existing=$(gh issue list --label production-incident --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --label production-incident \
              --title "Production monitor failing" \
              --body "The synthetic tests against $PROD_URL failed. Report: $RUN_URL"
          fi

      - name: Close incident issue when healthy again
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label production-incident --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: $RUN_URL"
          done
