name: OWASP ZAP baseline scan

# Scan passivo (não invasivo) do site publicado com o OWASP ZAP.
# Roda toda semana, depois de cada deploy e sob demanda.
# Achados aceitos conscientemente ficam em .zap/rules.tsv, com a justificativa.
on:
  schedule:
    - cron: "13 11 * * 1" # segundas, 08:13 em Brasília
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://vieira-security.github.io/pomodoro-timer/
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j # -a: inclui regras alfa; -j: spider AJAX (o app é JavaScript)
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
